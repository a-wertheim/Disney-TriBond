<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Not on the shelf</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDEDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;700&family=IBM+Plex+Mono&display=swap">
<style>
:root{
  --bg:#EDEDF2;--ink:#16161D;--ink-soft:#54545F;--ink-faint:#8A8A96;--line:#DADAE3;--link:#333C9E;
  --serif:"Instrument Serif","Georgia",serif;
  --sans:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#131318;--ink:#F0F0F5;--ink-soft:#A6A6B4;--ink-faint:#6E6E7C;--line:#2C2C38;--link:#98A0FF}
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  display:flex;align-items:center;justify-content:center;padding:32px;
  -webkit-font-smoothing:antialiased;
}
main{max-width:44ch}
.code{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink-faint);margin:0 0 16px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,8vw,62px);line-height:1.02;margin:0 0 16px;letter-spacing:-.015em}
p{margin:0 0 26px;color:var(--ink-soft)}
.links{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:22px}
.links a{color:var(--link);text-decoration:none;font-weight:700}
.links a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:3px}
</style>
</head>
<body>
<main>
  <p class="code">404 &middot; NOT FOUND</p>
  <h1>That card isn't in the drawer.</h1>
  <p>Nothing lives at this address. The three games are all one click away.</p>
  <nav class="links">
    <a href="index.html">The Game Shelf &mdash; all three games</a>
    <a href="once-upon-a-year.html">Once Upon a Year</a>
    <a href="the-year-drawer.html">The Year Drawer</a>
    <a href="e-ticket-tribond.html">E-Ticket TriBond</a>
  </nav>
</main>
</body>
</html>
